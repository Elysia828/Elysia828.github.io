<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CSS2综合网页作业</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
        .box { background: #fff; padding: 40px 50px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); text-align: center; max-width: 500px; }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        p { color: #555; line-height: 1.8; margin-bottom: 25px; }
        a { display: inline-block; padding: 12px 30px; background: #3498db; color: #fff; text-decoration: none; border-radius: 4px; font-size: 16px; }
        a:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="box">
        <h1>CSS2综合网页作业</h1>
        <p>作业代码已拆分为两个独立文件（满足外部CSS引入要求）：<br><strong>index.html</strong> + <strong>style.css</strong></p>
        <a href="index.html">打开作业页面 →</a>
    </div>
</body>
</html>
